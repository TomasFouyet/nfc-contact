<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      text-align: center;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 5px;
    }

    .cargo {
      color: #666;
      margin-top: 0;
    }

    .empresa {
      font-weight: bold;
      margin-bottom: 25px;
    }

    .button {
      display: block;
      background: #007aff;
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Tomás Apellido</h1>

    <p class="cargo">
      Ingeniero
    </p>

    <p class="empresa">
      Mi Empresa
    </p>

    <p>
      📞 +56 9 1234 5678
    </p>

    <p>
      ✉️ tomas@empresa.cl
    </p>

    <a class="button" href="tomas.vcf">
      Guardar contacto
    </a>

  </div>

</body>
</html>
