<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NFC Lab</title>
<link rel="stylesheet" href="../assets/lab.css">
</head>
<body data-method="M03">
<main>
<div id="status" class="notice info">Preparando descarga automática…</div>
<div id="card"></div>
<div id="top"></div>
<div id="bottom"></div>
</main>
<script src="../assets/contact.js"></script>
<script src="../assets/methods.js"></script>
<script src="../assets/lab.js"></script>
<script>
  var modo = Lab.qs('modo') || 'download';
  var url = Lab.vcfUrl();
  var status = document.getElementById('status');
  Lab.card(document.getElementById('card'), {
    actions: [{ label: 'Guardar contacto (si no se descargó)', href: url, primary: true }]
  });
  function go() {
    if (modo === 'iframe') {
      var f = document.createElement('iframe');
      f.style.display = 'none';
      f.src = url;
      document.body.appendChild(f);
      Lab.log('iframe oculto creado con src=.vcf');
    } else if (modo === 'enlace') {
      Lab.clickLink(url);
    } else {
      Lab.clickLink(url, { download: true });
    }
    status.textContent = 'Descarga automática disparada (modo: ' + modo + '). Si no ocurrió nada, usa el botón.';
  }
  // Se dispara apenas la página está lista, sin gesto de la persona.
  if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
</script>
</body>
</html>
