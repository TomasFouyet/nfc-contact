<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NFC Lab</title>
<link rel="stylesheet" href="../assets/lab.css">
</head>
<body data-method="M08">
<main>
<div id="top"></div>
<section class="panel">
  <h2>Variantes de Intent VIEW</h2>
  <p class="notice warn" id="ios" hidden>Estás en iOS: esta prueba es solo para Android.</p>
  <div class="btn-grid" id="btns"></div>
</section>
<div id="bottom"></div>
</main>
<script src="../assets/contact.js"></script>
<script src="../assets/methods.js"></script>
<script src="../assets/lab.js"></script>
<script>
  var C = NFCContact;
  var vcf = Lab.vcfUrl();
  var fb = Lab.abs('m02-boton/?desde=intent-view');
  var VARIANTS = [
    { id: 'W1', label: 'W1 · VIEW .vcf text/x-vcard', opts: { mime: 'text/x-vcard', fallback: fb } },
    { id: 'W2', label: 'W2 · VIEW .vcf text/vcard', opts: { mime: 'text/vcard', fallback: fb } },
    { id: 'W3', label: 'W3 · VIEW .vcf → Samsung Contacts', opts: { mime: 'text/x-vcard', pkg: 'com.samsung.android.app.contacts', fallback: fb } },
    { id: 'W4', label: 'W4 · VIEW .vcf → Google Contacts', opts: { mime: 'text/x-vcard', pkg: 'com.google.android.contacts', fallback: fb } }
  ];
  var box = document.getElementById('btns');
  VARIANTS.forEach(function (v) {
    var uri = C.buildViewVcfIntent(vcf, v.opts);
    var a = Lab.el('a', { 'class': 'btn', href: uri, text: v.label });
    a.addEventListener('click', function () { Lab.log('toque: ' + v.label); });
    box.appendChild(a);
    box.appendChild(Lab.el('details', null, [Lab.el('summary', { 'class': 'muted', text: 'URI de ' + v.id }), Lab.el('code', { text: uri })]));
  });
  if (Lab.env.os === 'ios') document.getElementById('ios').hidden = false;
</script>
</body>
</html>
