<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NFC Lab</title>
<link rel="stylesheet" href="../assets/lab.css">
</head>
<body data-method="M10">
<main>
<div id="top"></div>
<section class="panel">
  <h2>Compartir</h2>
  <div id="support"></div>
  <div class="btn-grid">
    <button class="btn primary" type="button" id="s1">S1 · Compartir archivo .vcf (text/vcard)</button>
    <button class="btn" type="button" id="s2">S2 · Compartir archivo .vcf (text/x-vcard)</button>
    <button class="btn" type="button" id="s3">S3 · Compartir solo el enlace (control)</button>
  </div>
  <p class="notice info" id="status" hidden></p>
</section>
<div id="bottom"></div>
</main>
<script src="../assets/contact.js"></script>
<script src="../assets/methods.js"></script>
<script src="../assets/lab.js"></script>
<script>
  var C = NFCContact, text = Lab.vcfText({ version: '3.0' });
  var status = document.getElementById('status');
  function say(m, cls) { status.hidden = false; status.className = 'notice ' + (cls || 'info'); status.textContent = m; Lab.log(m); }
  function file(type) { return new File([text], C.CONTACT.fileName, { type: type }); }
  function can(type) { try { return !!(navigator.canShare && navigator.canShare({ files: [file(type)] })); } catch (e) { return false; } }
  document.getElementById('support').appendChild(Lab.el('p', { 'class': 'mono muted', text:
    'navigator.share: ' + (navigator.share ? 'sí' : 'no') + ' · canShare(text/vcard): ' + can('text/vcard') + ' · canShare(text/x-vcard): ' + can('text/x-vcard') }));
  function shareFile(type) {
    if (!navigator.share) return say('Este navegador no tiene Web Share API.', 'err');
    var data = { files: [file(type)], title: C.CONTACT.fullName };
    if (navigator.canShare && !navigator.canShare(data)) return say('canShare() = false para ' + type + ': el navegador no permite compartir este archivo.', 'err');
    navigator.share(data).then(function () { say('share() resuelto: la persona eligió un destino.', 'ok'); })
      .catch(function (e) { say('share() rechazado: ' + e.name + ' — ' + e.message, 'err'); });
  }
  document.getElementById('s1').onclick = function () { Lab.log('toque S1'); shareFile('text/vcard'); };
  document.getElementById('s2').onclick = function () { Lab.log('toque S2'); shareFile('text/x-vcard'); };
  document.getElementById('s3').onclick = function () {
    Lab.log('toque S3');
    if (!navigator.share) return say('Sin Web Share API.', 'err');
    navigator.share({ title: C.CONTACT.fullName, url: Lab.abs('m02-boton/') })
      .then(function () { say('share() de enlace resuelto.', 'ok'); })
      .catch(function (e) { say('share() rechazado: ' + e.name, 'err'); });
  };
</script>
</body>
</html>
