<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NFC Lab</title>
<link rel="stylesheet" href="../assets/lab.css">
</head>
<body data-method="M06">
<main>
<div id="top"></div>
<section class="panel">
  <h2>Variantes</h2>
  <p class="muted">La vCard 3.0 se genera en el navegador con <code>contact.js</code>. Recarga la página entre una variante y otra, y registra cada una por separado.</p>
  <div class="btn-grid" id="btns"></div>
  <p class="notice info" id="status" hidden></p>
</section>
<div id="bottom"></div>
</main>
<script src="../assets/contact.js"></script>
<script src="../assets/methods.js"></script>
<script src="../assets/lab.js"></script>
<script>
  var C = NFCContact, name = C.CONTACT.fileName;
  var text = Lab.vcfText({ version: '3.0' });
  var status = document.getElementById('status');
  function blobUrl(type) {
    var u = URL.createObjectURL(new Blob([text], { type: type }));
    setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
    return u;
  }
  function dataUri(type) { return 'data:' + type + ';charset=utf-8,' + encodeURIComponent(text); }
  function say(m) { status.hidden = false; status.textContent = m; Lab.log(m); }

  var VARIANTS = {
    'blob-download': { label: 'B1 · Blob text/vcard + download', run: function () { Lab.clickLink(blobUrl('text/vcard'), { download: name }); } },
    'blob-download-x': { label: 'B2 · Blob text/x-vcard + download', run: function () { Lab.clickLink(blobUrl('text/x-vcard'), { download: name }); } },
    'blob-nav': { label: 'B3 · Navegar al Blob text/vcard (sin download)', run: function () { location.href = blobUrl('text/vcard'); } },
    'blob-open': { label: 'B4 · Abrir el Blob en pestaña nueva', run: function () { var w = window.open(blobUrl('text/vcard'), '_blank'); say(w ? 'window.open devolvió una ventana' : 'window.open bloqueado (null)'); } },
    'data-download': { label: 'D1 · data: URI + download', run: function () { Lab.clickLink(dataUri('text/vcard'), { download: name }); } },
    'data-nav': { label: 'D2 · Navegar a data: URI', run: function () { location.href = dataUri('text/vcard'); } }
  };
  var box = document.getElementById('btns');
  Object.keys(VARIANTS).forEach(function (k) {
    var b = Lab.el('button', { 'class': 'btn', type: 'button', text: VARIANTS[k].label });
    b.addEventListener('click', function () {
      Lab.log('toque: ' + VARIANTS[k].label);
      try { VARIANTS[k].run(); say('Ejecutado: ' + VARIANTS[k].label); }
      catch (e) { say('Error en ' + k + ': ' + e.message); }
    });
    box.appendChild(b);
  });

  var auto = Lab.qs('auto');
  if (auto && VARIANTS[auto]) {
    say('Modo automático (sin gesto): ' + VARIANTS[auto].label);
    try { VARIANTS[auto].run(); } catch (e) { say('Error: ' + e.message); }
  }
</script>
</body>
</html>
